{{ define "main" }}

<article>

<header class="post-header">
  <h1 class="post-title">{{ .Title }}</h1>

  {{ if eq .Section "blog" }}
    {{ with .Site.Params.author }}
    <div class="post-author">
      By {{ . }}
    </div>
    {{ end }}
  {{ end }}
</header>

<div class="post-content">
  {{ .Content }}
</div>

</article>

{{ end }}
