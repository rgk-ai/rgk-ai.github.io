{{ define "main" }}

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>

    <div class="post-meta">
      {{ .Date.Format "January 2, 2006" }}
      {{ if gt .ReadingTime 0 }}
      · {{ .ReadingTime }} min read
      {{ end }}
    </div>

    {{ with .Params.tags }}
    <div class="post-tags">
      {{ range . }}
      <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/">{{ . }}</a>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>

{{ end }}
